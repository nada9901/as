version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: healthgluco_postgres
    restart: always
    environment:
      POSTGRES_DB: healthgluco_db
      POSTGRES_USER: healthgluco_user
      POSTGRES_PASSWORD: healthgluco_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthgluco_user -d healthgluco_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: healthgluco_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://healthgluco_user:healthgluco_secure_password_2026@db:5432/healthgluco_db
      SECRET_KEY: "healthgluco_super_secure_jwt_secret_key_2026"
      REFRESH_SECRET_KEY: "healthgluco_refresh_secret_2026"
      MODEL_THRESHOLD: "0.10"
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: healthgluco_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
